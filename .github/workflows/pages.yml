name: Deploy GitHub Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify release
        run: node tests/verify-release.cjs

      - name: Verify guided tutorial
        run: node tests/verify-guided-tutorial.cjs

      - name: Prepare static preview
        run: |
          mkdir _site
          cp index.html ./*.js ./*.css _site/
          cp -R assets routes guided-tutorial _site/
          cp release-manifest.json _site/
          touch _site/.nojekyll
          test ! -e _site/record_result.php
          test ! -e _site/assign_condition.php
          test ! -e _site/server-common.php
          test ! -e _site/.htaccess

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
