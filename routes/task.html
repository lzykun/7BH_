<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Coordination Rules</title>
  <link rel="icon" href="data:,">
  <meta name="study-data-endpoint" content="../record_result.php">
  <link rel="stylesheet" href="../styles.css?v=7bh-formal-v23">
  <link rel="stylesheet" href="../shuffle-controls.css">
</head>
<body data-stage="task" data-asset-prefix="../">
<div class="task-viewport" id="task-viewport">
<div class="task-scale-shell" id="task-scale-shell">
<div class="wrap">
  <div class="taskbar">
    <div class="taskbar-head">
      <div class="case-summary" id="case-summary"></div>
    </div>
    <div class="tabs" id="tabs"></div>
  </div>

  <div class="main">
    <section class="scene-panel" aria-label="Current task">
      <div class="section-heading scene-heading">
        <div class="scene-heading-actions">
          <button class="guide-button" id="scene-guide" type="button" hidden>Guide</button>
        </div>
      </div>
      <div class="scene-goal" id="scene-goal" aria-labelledby="scene-goal-title">
        <div class="scene-goal-heading">
          <strong id="scene-goal-title">Goals</strong>
        </div>
        <div class="scene-goal-list" id="scene-goal-list"></div>
      </div>
      <div class="scene-visual">
        <div class="board-frame">
          <div class="board" id="board"></div>
        </div>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
      <div class="agent-panel" id="agent-progress"></div>
      <div class="scene-bottom-controls">
        <div class="controls scene-run-controls">
          <button class="btn primary" id="run">Run rule</button>
          <div class="step-nav" aria-label="Animation step controls">
            <button class="btn step-button" id="prev" aria-label="Previous step" title="Previous step">←</button>
            <span class="step-label" id="step-label">Step 0 / 0</span>
            <button class="btn step-button" id="next" aria-label="Next step" title="Next step">→</button>
          </div>
        </div>
      </div>
    </section>

    <section class="rules-panel" aria-labelledby="rules-panel-title">
      <div class="section-heading rules-heading">
        <div>
          <h2 id="rules-panel-title">Rules</h2>
        </div>
        <span class="rule-count" id="rule-count">0 rules</span>
      </div>
      <div class="rulebook-actions">
        <button class="btn add-rule-button" id="addrule">Add Rule</button>
      </div>
      <div id="rules"></div>
      <section class="library-panel" aria-labelledby="library-title">
        <div class="library-heading">
          <div>
            <h3 id="library-title">Saved rule library</h3>
          </div>
          <span class="rule-count" id="library-count">0 saved</span>
        </div>
        <div id="library"></div>
      </section>
      <div class="researcher-panel" id="researcher-panel" hidden>
        <p class="vocab" id="vocab"></p>
        <div class="log" id="log"></div>
        <div class="controls export-controls">
          <button class="btn" id="export-json">Export JSON</button>
          <button class="btn" id="export-csv">Export CSV</button>
        </div>
      </div>
    </section>

  </div>
</div>
</div>
</div>

<div class="guide-backdrop" id="guide-backdrop" hidden>
  <section class="guide-dialog" role="dialog" aria-modal="true" aria-labelledby="guide-title">
    <div class="guide-kicker" id="guide-kicker">Task guide</div>
    <h2 id="guide-title"></h2>
    <div class="guide-items" id="guide-items"></div>
    <p id="guide-body"></p>
    <div class="guide-example" id="guide-example"></div>
    <button class="btn primary guide-close" id="guide-close" type="button">Continue to task</button>
  </section>
</div>

<div class="notice-backdrop" id="notice-backdrop" hidden>
  <section class="notice-dialog" role="dialog" aria-modal="true" aria-labelledby="notice-title">
    <h2 id="notice-title">Rule not ready</h2>
    <p id="notice-message"></p>
    <button class="btn primary notice-close" id="notice-close" type="button">OK</button>
  </section>
</div>

<dialog class="task-success-dialog" id="task-success-dialog" aria-label="Success"></dialog>

<div class="task-complete-backdrop" id="task-complete-backdrop" hidden>
  <section class="task-complete-dialog" role="dialog" aria-modal="true" aria-labelledby="task-complete-title" aria-describedby="task-complete-message">
    <p class="onboarding-kicker">Tasks complete</p>
    <h2 id="task-complete-title">All tasks complete</h2>
    <p id="task-complete-message">You have completed all the tasks.</p>
    <p class="task-complete-save-status" id="task-complete-save-status" role="status" aria-live="polite">Saving your responses...</p>
    <div class="task-complete-actions">
      <button class="btn" id="task-complete-retry" type="button" hidden>Retry saving</button>
      <button class="btn primary" id="task-complete-debrief" type="button" disabled>Continue to debrief</button>
    </div>
  </section>
</div>
<script src="../shared-pool.js?v=7bh-formal-v23"></script>
<script src="../study-config.js?v=7bh-formal-v23"></script>
<script src="../data-collector.js?v=7bh-formal-v23"></script>
<script src="../shuffle-bootstrap.js?v=7bh-formal-v23"></script>
<script src="../engine.js?v=7bh-formal-v23"></script>
<script src="../study_feedback.js?v=7bh-formal-v23"></script>
<script src="../shuffle-controls.js?v=7bh-formal-v23"></script>
<script src="../app.js?v=7bh-formal-v23"></script>
</body>
</html>
